server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name v2202608397611499388.supersrv.de;
    client_max_body_size 50m;

    location / {
        proxy_pass https://printcenter-robin.robin1999.chatgpt.site;
        proxy_ssl_server_name on;
        proxy_ssl_name printcenter-robin.robin1999.chatgpt.site;

        proxy_http_version 1.1;
        proxy_set_header Host printcenter-robin.robin1999.chatgpt.site;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
